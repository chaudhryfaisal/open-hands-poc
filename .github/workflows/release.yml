name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run tests
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --verbose
        
      - name: Run clippy
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo clippy -- -D warnings
        
      - name: Check formatting
        run: cargo fmt -- --check

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: true
            
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            cross: true
            
          # Windows targets
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            
          - target: i686-pc-windows-msvc
            os: windows-latest
            cross: false
            
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: false
            
          # macOS targets
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            
          # Android targets
          - target: aarch64-linux-android
            os: ubuntu-latest
            cross: true
            
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            cross: true
            
          - target: x86_64-linux-android
            os: ubuntu-latest
            cross: true
            
          - target: i686-linux-android
            os: ubuntu-latest
            cross: true

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          
      - name: Build with cargo
        if: '!matrix.cross'
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Build with cross
        if: matrix.cross
        env:
          CARGO_BUILD_JOBS: 1
        run: cross build --release --target ${{ matrix.target }}
        
      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          
          # Determine file extension
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXT=".exe"
          else
            EXT=""
          fi
          
          # Create archive
          tar -czf ../../../dist/reverse-shell-${{ matrix.target }}.tar.gz \
            reverse-shell-server${EXT} \
            reverse-shell-client${EXT} \
            reverse-shell-cli${EXT}
            
      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          cd target/${{ matrix.target }}/release
          7z a ../../../dist/reverse-shell-${{ matrix.target }}.zip reverse-shell-server.exe reverse-shell-client.exe reverse-shell-cli.exe
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: reverse-shell-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
          
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -o -name "*.zip" | while read file; do
            cp "$file" release-assets/
          done
          ls -la release-assets/
          
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body: |
            ## Reverse Shell System Release
            
            This release includes pre-compiled binaries for multiple architectures:
            
            ### Components
            - **reverse-shell-server**: WebSocket server for managing client connections
            - **reverse-shell-client**: Client that connects to server and executes commands
            - **reverse-shell-cli**: CLI interface for interacting with connected clients
            
            ### Supported Platforms
            - Linux (x86_64, aarch64, armv7) - GNU and musl variants
            - Windows (x86_64, i686, aarch64)
            - macOS (x86_64, aarch64)
            - Android (aarch64, armv7, x86_64, i686)
            
            ### Security Features
            - Authentication with bcrypt-hashed tokens
            - WebSocket communication with optional SSL/TLS
            - Command validation and safety checks
            - Comprehensive logging
            
            ### Quick Start
            1. Download the appropriate binary for your platform
            2. Extract the archive
            3. Run the server: `./reverse-shell-server --client-port 8080 --admin-port 8081`
            4. Run a client: `./reverse-shell-client --server localhost:8080 --token your_token`
            5. Connect with CLI: `./reverse-shell-cli --server localhost:8081 --token admin_token`
            
            See the README for detailed usage instructions.
            
            **Checksums**: See `checksums.txt` for file integrity verification.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max